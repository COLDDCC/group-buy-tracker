<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>骏和屋代购记录助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>骏和屋代购记录助手</h1>
      <button id="openOptions" title="设置">⚙</button>
    </header>

    <p id="scrapeStatus" class="hint"></p>
    <button id="scrapeBtn" class="secondary">重新抓取（页面内容后加载完可以再点一次）</button>

    <form id="recordForm">
      <label>商品图片链接
        <input type="url" id="image" placeholder="https://..." />
      </label>
      <img id="imagePreview" alt="" referrerpolicy="no-referrer" />

      <label>商品名称
        <input type="text" id="name" placeholder="商品名称" />
      </label>

      <label>商品链接
        <input type="url" id="link" placeholder="https://..." />
      </label>

      <div class="price-row">
        <label>平时价格
          <input type="number" step="0.01" id="normalPrice" placeholder="0.00" />
        </label>
        <label>实际价格
          <input type="number" step="0.01" id="actualPrice" placeholder="0.00" />
        </label>
      </div>

      <button type="submit" class="primary">保存到表格</button>
    </form>

    <p id="saveStatus" class="hint"></p>
    <pre id="imageDebug" class="debug"></pre>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
